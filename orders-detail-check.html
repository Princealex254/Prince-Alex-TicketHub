let signingKey = null, publicJwk = null;
async function makeKey(){
  const b64 = HARNESS_PKCS8.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  signingKey = await crypto.subtle.importKey("pkcs8", bytes, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["sign"]);
  publicJwk = HARNESS_JWK;
}
async function mintToken(uid, email, extra){
  const now = Math.floor(Date.now() / 1000);
  const header = b64u(utf8(JSON.stringify({ alg: "RS256", kid: KID, typ: "JWT" })));
  const payload = b64u(utf8(JSON.stringify(Object.assign({
    iss: "https://securetoken.google.com/" + PROJECT, aud: PROJECT, sub: uid,
    email: email, iat: now, exp: now + 3600, email_verified: true
  }, extra || {}))));
  const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", signingKey, utf8(header + "." + payload));
  return header + "." + payload + "." + b64u(sig);
}

    ],
    order_items: [{ id: 1, order_id: 100, ticket_type_id: 11, ticket_type_name: "Regular", quantity: 2, unit_price: 1500, subtotal: 3000 }],
    payments: [{ id: 1, order_id: 100, provider: "paystack", reference: "PAT-AAAAA11111", amount: 3000, currency: "KES", status: "success", provider_ref: "PS-1" }],
    tickets: [
      { id: 1, order_id: 100, event_id: 10, ticket_type_id: 11, attendee_name: "Jane Wanjiru", attendee_email: "jane@example.com", ticket_number: "PAT-AAAAA11111-A", qr_token: "qr-1", status: "valid", checked_in: 0, checked_in_at: null, created_at: "2026-03-01 10:05:00" },
      { id: 2, order_id: 100, event_id: 10, ticket_type_id: 11, attendee_name: "Jane Wanjiru", attendee_email: "jane@example.com", ticket_number: "PAT-AAAAA11111-B", qr_token: "qr-2", status: "used", checked_in: 1, checked_in_at: "2026-03-01 18:30:00", created_at: "2026-03-01 10:05:00" }
    ],
    ticket_types: [{ id: 11, event_id: 10, name: "Regular", price: 1500, quantity: 50, sold: 2, status: "active" }],
    rate_limits: [], email_outbox: [],
    app_settings: [{ key: "email_from_email", value: "tickets@princealexdigital.com" }, { key: "platform_name", value: "Prince Alex TicketHub" }, { key: "email_enabled", value: "false" }]
  };
  const stmt = (sql, bound) => {
    const p = bound || [];
    const rows = () => {
      if(/FROM users/.test(sql)) return /firebase_uid = \?/.test(sql) ? state.users.filter(u => u.firebase_uid === p[0]) : state.users.slice();
      if(/FROM organizers/.test(sql)) return /user_id = \?/.test(sql) ? state.organizers.filter(o => String(o.user_id) === String(p[0])) : state.organizers.slice();
      if(/FROM events/.test(sql)) return /(e\.id|id) = \?/.test(sql) ? state.events.filter(e => String(e.id) === String(p[0])) : state.events.slice();
      if(/FROM orders\b/.test(sql)){
        /* honours the ownership scope the route adds: organizer_id = ? */
        let out = state.orders;
        if(/organizer_id = \?/.test(sql)) out = out.filter(o => String(o.organizer_id) === String(p[0]));
        if(/event_id IN/.test(sql)) out = [];
        if(/AND o\.id = \?/.test(sql)) out = out.filter(o => String(o.id) === String(p[p.length - 1]));
        if(/order_number = \?/.test(sql)) out = out.filter(o => o.order_number === p[0]);
        /* the detail route LEFT JOINs the event, so mirror the joined title */
        if(/e\.title AS event_title/.test(sql)){
          out = out.map(o => { const ev = state.events.filter(e => String(e.id) === String(o.event_id))[0];
            return Object.assign({}, o, { event_title: ev ? ev.title : null, event_date: ev ? ev.event_date : null,
              start_time: ev ? ev.start_time : null, venue: ev ? ev.venue : null, location: ev ? ev.location : null }); });
        }
        return out;
      }
      if(/FROM order_items/.test(sql)) return state.order_items.filter(r => String(r.order_id) === String(p[0]));
      if(/FROM payments\b/.test(sql)) return state.payments.filter(r => String(r.order_id) === String(p[0]));
      if(/FROM tickets/.test(sql)) return state.tickets.filter(t => /order_id = \?/.test(sql) ? String(t.order_id) === String(p[0]) : true);
      if(/FROM ticket_types/.test(sql)) return state.ticket_types.slice();
      if(/FROM rate_limits/.test(sql)) return [];
      if(/FROM event_staff/.test(sql)) return [];
      if(/FROM app_settings/.test(sql)) return state.app_settings.slice();
      if(/FROM email_outbox/.test(sql)) return [];
      return [];
    };
    return {
      sql: sql, params: p,
      bind: (...a) => stmt(sql, a),
      all: async () => ({ results: rows() }),
      first: async () => rows()[0] || null,
      run: async () => ({ meta: { changes: 0, last_row_id: null } })
    };
  };
  return { db: { prepare: sql => stmt(sql, []), batch: async () => [{ results: [] }, { results: [] }] }, state: state };
}
function makeEnv(extra){
  const d = makeDb();
  const env = { DB: d.db, FIREBASE_PROJECT_ID: PROJECT, ALLOWED_ORIGINS: "https://tickethub.princealex.digital",
    FRONTEND_URL: "https://tickethub.princealex.digital" };
  for(const k of Object.keys(extra || {})) env[k] = String(extra[k]);
  env.__state = d.state;
  return env;
}

let ipSeq = 0;
function nextIp(){ ipSeq++; return "41.90." + Math.floor(ipSeq / 200) + "." + (1 + (ipSeq % 200)); }
async function get(path, token, env, ip){
  const headers = { "CF-Connecting-IP": ip || nextIp() };
  if(token) headers["Authorization"] = "Bearer " + token;
  const res = await W.default.fetch(new Request(API + path, { method: "GET", headers: headers }), env || makeEnv(), ctx);
  let body = null;
  try { body = await res.clone().json(); } catch(e){ body = null; }
  return { status: res.status, body: body || {} };
}

(async () => {
  const marks = [];
  const mark = (m) => { const b = document.getElementById("out"); if(b) b.textContent = "MARK " + m;
    try { fetch("/progress", { method: "POST", body: String(m) }); } catch(e){} };
  mark("module started");
  const realWarn = console.warn, realError = console.error;
  console.warn = (...a) => marks.push("W " + a.map(x => String(x)).join(" "));
  console.error = (...a) => marks.push("E " + a.map(x => String(x)).join(" "));
  try {
    /* the JWKS the Worker will fetch, signed with the harness key. Everything
       else (including this page's own /report hand-off) goes to the network. */
    window.fetch = async (url, init) => {
      const href = String(url && url.url ? url.url : url);
      if(href.indexOf("googleapis.com") > -1 || href.indexOf("securetoken") > -1){
        return new Response(JSON.stringify({ keys: [publicJwk] }), { status: 200, headers: { "Content-Type": "application/json" } });
      }

  } catch(e){ ck("the Worker compiles with the new route registered", false, (e && e.message) || String(e)); finish(); return; }

  try {

       "items " + (o.items || []).length + ", tickets " + (o.tickets || []).length);

       !!ok.body.order && ok.body.order_number === "PAT-AAAAA11111", "");
    const qr = (o.tickets || [])[0] ? String(o.tickets[0].qr_image_url || "") : "";

async function group2(token, marks){
  try {
    const ip = "41.90.50.10";
    const other = await get("/api/organizer/orders/200", token, makeEnv(), ip);
    ck("another organizer's order is not readable (404, no cross-tenant data)",
       other.status === 404 && other.body.code === "NOT_FOUND" &&
       JSON.stringify(other.body).indexOf("Someone Else") === -1,
       other.status + " " + other.body.code);
    const unknown = await get("/api/organizer/orders/999", token, makeEnv(), ip);
    ck("an order id that does not exist is 404", unknown.status === 404, unknown.status + " " + unknown.body.code);

    const anon = await get("/api/organizer/orders/100", null, makeEnv(), ip);
    ck("without a Firebase token the route answers 401 (not 404, not 200)",
       anon.status === 401 && anon.body.code === "UNAUTHENTICATED", anon.status + " " + anon.body.code);
    const garbage = await get("/api/organizer/orders/100", "not.a.jwt", makeEnv(), ip);
    ck("a malformed token is refused with 401", garbage.status === 401, garbage.status + " " + garbage.body.code);
    const tampered = await get("/api/organizer/orders/100", token.slice(0, -4) + "AAAA", makeEnv(), ip);
    ck("a token with a broken signature is refused with 401", tampered.status === 401, tampered.status + " " + tampered.body.code);
    const expired = TOKEN_EXPIRED;
    const stale = await get("/api/organizer/orders/100", expired, makeEnv(), ip);
    ck("an expired token is refused with 401", stale.status === 401, stale.status + " " + stale.body.code);

    const bad = await get("/api/organizer/orders/abc", token, makeEnv(), ip);
    ck("a non-numeric order id is rejected with 422", bad.status === 422, bad.status + " " + bad.body.code);

    /* the new route is rate limited like everything else */
    const envLimited = makeEnv({ RATE_ORDER_DETAIL_LIMIT: "2", RATE_ORDER_DETAIL_WINDOW: "600" });
    const limitedIp = "41.90.51.1";
    const codes = [];
    for(let i = 0; i < 3; i++) codes.push((await get("/api/organizer/orders/100", token, envLimited, limitedIp)).status);
    ck("the new route honours its rate limit (2 allowed, 3rd is 429)",
       codes.join(",") === "200,200,429", codes.join(","));

    /* the page and the API agree on the path, and nothing secret was logged */
    const html = await (await realFetch("./orders/index.html")).text();
    ck("orders/index.html still requests /api/organizer/orders/<id>",
       /api\("\/api\/organizer\/orders\/" \+ encodeURIComponent\(id\)\)/.test(html), "");
    ck("the drawer now prefers issued tickets over order lines",
       /const issued = normList\(o, "tickets"\)/.test(html) && /issued\.length \? issued : normList\(o, "items"\)/.test(html), "");
    const noLeak = marks.join(" | ");
    ck("nothing secret or opaque was logged while serving the order",
       noLeak.indexOf(token.slice(-12)) === -1 && noLeak.indexOf("qr-1") === -1, "");
  } catch(e){ ck("harness completed group 2", false, (e && e.stack) || String(e)); }
  window.fetch = realFetch;
  finish();
}
