<link rel="apple-touch-icon" href="/favicon.svg" />
</head><body>
<div id="out">running</div>
<script>
window.addEventListener("error", function(e){
  var b = document.getElementById("out");
  if(b) b.textContent = "JS ERROR: " + (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || 0);
});
window.addEventListener("unhandledrejection", function(e){
  var b = document.getElementById("out");
  var r = e && e.reason;
  if(b) b.textContent = "REJECTED: " + ((r && (r.stack || r.message)) || r);
});
</script>
<script>
/* ===========================================================================
   Prince Alex TicketHub - three-provider payment harness
   ---------------------------------------------------------------------------
   Loads the real Worker (worker/worker.js) and drives the whole payment
   workflow against a mocked D1, a mocked Firebase signing key and mocked
   Paystack / Pesapal / PayHero APIs, so the unified payment service, the
   provider resolver, organizer isolation and every webhook branch are
   exercised for real.

   Serve the repository over http (tools\serve.ps1) and open /payhero-check.html
   - ES modules cannot be loaded from file://.
   ========================================================================= */
var R = { tests: [], notes: [] };
var realFetch = window.fetch.bind(window);
var KEEP = setInterval(function(){ }, 100);
function ck(name, pass, detail){
  R.tests.push({ name: name, pass: !!pass, detail: detail === undefined ? "" : String(detail) });
  var box = document.getElementById("out");
  if(box) box.textContent = "PROGRESS " + R.tests.length + ": " + name;
}
function note(text){ R.notes.push(String(text)); }
/* Breadcrumb so a hang can be located from the last thing that ran. */
var STEP = "start";
function step(text){ STEP = text; var b = document.getElementById("out"); if(b) b.textContent = "STEP: " + text; }
function finish(){
  R.step = STEP;
  R.summary = { total: R.tests.length, passed: R.tests.filter(function(t){ return t.pass; }).length,
                failed: R.tests.filter(function(t){ return !t.pass; }).length };
  clearInterval(KEEP);
  var text = "RESULTS_JSON:" + JSON.stringify(R);
  document.getElementById("out").textContent = text;
  /* Also hand the result back to tools\run-check.ps1, which is far more
     reliable than guessing when a headless page is finished. */
  try { realFetch("/__result", { method: "POST", body: JSON.stringify(R) }); } catch(e){ }
}
/* ===========================================================================
   A small SQL subset engine, so the Worker runs against real relational
   behaviour (guards, COALESCE, ORDER BY, joins, aggregates, CHECK
   constraints) instead of a set of canned answers.
   ========================================================================= */
function makeDb(seed, options){
  var strict = !!(options && options.strict);
  var T = {};
  for(var name in seed) T[name] = seed[name].map(function(r){ return Object.assign({}, r); });
  /* In strict mode the database behaves like a real one: an unknown table or a
     column the rows do not have is an error, which is how a database that has
     not been migrated yet actually fails. */
  function requireTable(table, sql){
    if(Object.prototype.hasOwnProperty.call(T, table)) return;
    if(strict) throw new Error("D1_ERROR: no such table: " + table + "  SQL: " + sql.slice(0, 120));
  }
  function requireColumn(table, column, sql){
    if(!strict) return;
    /* A missing table is requireTable's business; only check columns on a table
       that exists, so one problem is reported at a time. */
    if(!Object.prototype.hasOwnProperty.call(T, table)) return;
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(column)) return;
    var rows = T[table] || [];
    if(!rows.length) return;                    /* nothing to prove it against */
    for(var i = 0; i < rows.length; i++){
      if(Object.prototype.hasOwnProperty.call(rows[i], column)) return;
    }
    throw new Error("D1_ERROR: no such column: " + column + "  SQL: " + sql.slice(0, 120));
  }
  var seq = {};
  for(var n2 in T) seq[n2] = T[n2].reduce(function(m, r){ return Math.max(m, Number(r.id) || 0); }, 0);

  function lit(v){
    if(v === null || v === undefined) return null;
    if(typeof v !== "string") return v;
    var s = v.trim();
    if(/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    if(s === "NULL") return null;
    if(s === "true") return true;
    if(s === "false") return false;
    if(/^'.*'$/.test(s)) return s.slice(1, -1).replace(/''/g, "'");
    if(/^".*"$/.test(s)) return s.slice(1, -1);
    return s;
  }
  function splitArgs(s){
    var out = [], depth = 0, cur = "", quote = null;
    for(var i = 0; i < s.length; i++){
      var ch = s[i];
      if(quote){ cur += ch; if(ch === quote) quote = null; continue; }
      if(ch === "'" || ch === '"'){ quote = ch; cur += ch; continue; }
      if(ch === "(") depth++;
      if(ch === ")") depth--;
      if(ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
      cur += ch;
    }
    if(cur.trim() !== "") out.push(cur);
    return out;
  }
  function splitLogic(s, kw){
    var out = [], depth = 0, cur = "", quote = null;
    for(var i = 0; i < s.length; i++){
      var ch = s[i];
      if(quote){ cur += ch; if(ch === quote) quote = null; continue; }
      if(ch === "'" || ch === '"'){ quote = ch; cur += ch; continue; }
      if(ch === "(") depth++;
      if(ch === ")") depth--;
      var rest = s.slice(i, i + kw.length).toUpperCase();
      /* A value can end in a placeholder, a quote, a bracket or a character, so
         "a = ? AND b = ?" has to split just as well as "a = 1 AND b = 2". */
      if(depth === 0 && rest === kw && /[\s)?\w']/.test(s.charAt(i - 1) || " ")){
        out.push(cur); cur = ""; i += kw.length - 1; continue;
      }
      cur += ch;
    }
    out.push(cur);
    return out.filter(function(x){ return x.trim() !== ""; });
  }
  /* Bound parameters are consumed through one cursor, exactly like a real
     prepared statement: "a = ? AND b = ?" must use param 1 for a and param 2
     for b, not the same value twice. */
  function cursor(params){ return { a: (params || []).slice(), i: 0 }; }
  function take(c){ var v = (c.a[c.i] === undefined) ? null : c.a[c.i]; c.i++; return v; }
  function valueOf(expr, c, row){
    var s = String(expr).trim();
    if(s === "?") return take(c);
    if(/^COALESCE\(/i.test(s)){
      var inner = s.slice(s.indexOf("(") + 1, s.lastIndexOf(")"));
      var args = splitArgs(inner);
      /* SQL evaluates every argument and returns the first non-null one, so all
         of their placeholders are consumed: a skipped placeholder would shift
         every later value in the statement. */
      var value = null, seen = false;
      for(var i = 0; i < args.length; i++){
        var v = valueOf(args[i], c, row);
        if(!seen && v !== null && v !== undefined){ value = v; seen = true; }
      }
      return seen ? value : null;
    }
    if(/^COALESCE\(\s*(MAX|MIN)\(/i.test(s) || /^(MAX|MIN)\(/i.test(s)){
      var body = s.slice(s.indexOf("(") + 1, s.lastIndexOf(")"));
      var args2 = splitArgs(body).map(function(p){ return valueOf(p, c, row); });
      var isMax = /MAX/i.test(s.slice(0, 12));
      var nums = args2.filter(function(a){ return a !== null && a !== ""; }).map(Number);
      return isMax ? Math.max.apply(null, [0].concat(nums)) : Math.min.apply(null, [0].concat(nums));
    }
    if(/^[A-Za-z_][A-Za-z0-9_.]*$/.test(s)) return cell(row, s);
    if(/^[A-Za-z_][A-Za-z0-9_.]*\s*[+-]\s*([A-Za-z_][A-Za-z0-9_.]*|\?|-?\d+(\.\d+)?|'[^']*')$/.test(s)){
      var m = /^([A-Za-z_][A-Za-z0-9_.]*)\s*([+-])\s*(.+)$/.exec(s);
      var left = cell(row, m[1]) || 0;
      var right = valueOf(m[3], c, row);
      if(left === null || right === null) return null;
      return m[2] === "+" ? Number(left) + Number(right) : Number(left) - Number(right);
    }
    return lit(s);
  }
  /* "e.id" and "id" are the same column once a query is joined, and a correlated
     subquery may refer to the outer row (OUTER). */
  var OUTER = null;
  function cell(row, col){
    if(row){
      if(row[col] !== undefined) return row[col];
      var short = col.split(".").pop();
      if(row[short] !== undefined) return row[short];
    }
    if(OUTER){
      if(OUTER[col] !== undefined) return OUTER[col];
      var s2 = col.split(".").pop();
      if(OUTER[s2] !== undefined) return OUTER[s2];
    }
    return null;
  }
  function matchCond(cond, row, c){
    cond = String(cond).trim();
    if(cond === "") return true;
    var orParts = splitLogic(cond, " OR ");
    if(orParts.length > 1){
      /* Every branch consumes its own parameters, whether or not it matched. */
      var matched = false;
      for(var i = 0; i < orParts.length; i++){
        var branch = { a: c.a, i: c.i };
        if(matchCond(orParts[i], row, branch)) matched = true;
        c.i = branch.i;
      }
      return matched;
    }
    var ands = splitLogic(cond, " AND ");
    if(ands.length > 1){
      for(var j = 0; j < ands.length; j++){
        if(!matchCond(ands[j], row, c)) return false;
      }
      return true;
    }
    var m = /^([A-Za-z_][A-Za-z0-9_.]*)\s+IN\s*\((.*)\)$/i.exec(cond);
    if(m){
      if(/^\s*SELECT\b/i.test(m[2])){
        var sub = runSelect(m[2], c.a.slice(c.i));
        c.i = c.a.length;
        for(var k = 0; k < sub.length; k++) if(c.a.indexOf(sub[k][m[1]]) > -1) return true;
        return false;
      }
      var list = splitArgs(m[2]).map(function(p){ return valueOf(p, c, row); });
      return list.indexOf(cell(row, m[1])) > -1;
    }
    m = /^([\s\S]+?)\s*(<=|>=|<>|!=|=|<|>)\s*([\s\S]+)$/.exec(cond);
    if(m){
      /* Both sides may be arithmetic, e.g. the atomic stock guard
         "sold + ? <= quantity - sold". */
      var left = valueOf(m[1], c, row);
      var right = valueOf(m[3], c, row);
      var bothNull = (left === null || left === undefined) && (right === null || right === undefined);
      if(m[2] === "=") return bothNull ? false : String(left) === String(right);
      if(m[2] === "!=" || m[2] === "<>") return bothNull ? true : String(left) !== String(right);
      if(m[2] === "<") return Number(left) < Number(right);
      if(m[2] === "<=") return Number(left) <= Number(right);
      if(m[2] === ">") return Number(left) > Number(right);
      if(m[2] === ">=") return Number(left) >= Number(right);
    }
    m = /^([A-Za-z_][A-Za-z0-9_.]*)\s+LIKE\s+(.+)$/i.exec(cond);
    if(m) return String(cell(row, m[1]) || "").indexOf(String(valueOf(m[2], c, row)).replace(/%/g, "")) > -1;
    m = /^([A-Za-z_][A-Za-z0-9_.]*)\s+IS\s+NOT\s+NULL$/i.exec(cond);
    if(m) return cell(row, m[1]) !== null && cell(row, m[1]) !== undefined;
    m = /^([A-Za-z_][A-Za-z0-9_.]*)\s+IS\s+NULL$/i.exec(cond);
    if(m) return cell(row, m[1]) === null || cell(row, m[1]) === undefined;
    throw new Error("unsupported WHERE clause: " + cond);
  }
  /* The top-level FROM, ignoring any FROM inside a subquery in the select list. */
  function splitSelect(sql){
    var s = String(sql).trim();
    if(!/^SELECT\b/i.test(s)) return null;
    var depth = 0, quote = null, fromAt = -1;
    for(var i = 0; i < s.length; i++){
      var ch = s[i];
      if(quote){ if(ch === quote) quote = null; continue; }
      if(ch === "'" || ch === '"'){ quote = ch; continue; }
      if(ch === "("){ depth++; continue; }
      if(ch === ")"){ depth--; continue; }
      if(depth === 0 && i > 0 && /\sFROM\s/i.test(s.slice(i, i + 6))){
        fromAt = i + 1;
        break;
      }
    }
    if(fromAt < 0) return null;
    var tm = /^FROM\s+([a-z_]+)([\s\S]*)$/i.exec(s.slice(fromAt).trim());
    if(!tm) return null;
    return { cols: s.slice(s.indexOf(" ") + 1, fromAt).trim(), table: tm[1].toLowerCase(), rest: tm[2] || "" };
  }
  /* Splits a select list on commas that are not inside parentheses. */
  function splitColumns(cols){
    var out = [], depth = 0, cur = "", quote = null;
    for(var i = 0; i < cols.length; i++){
      var ch = cols[i];
      if(quote){ cur += ch; if(ch === quote) quote = null; continue; }
      if(ch === "'" || ch === '"'){ quote = ch; cur += ch; continue; }
      if(ch === "(") depth++;
      if(ch === ")") depth--;
      if(ch === "," && depth === 0){ out.push(cur); cur = ""; continue; }
      cur += ch;
    }
    out.push(cur);
    return out;
  }
  function runSelect(sql, params){
    var c = cursor(params);
    var parsed = splitSelect(sql);
    if(!parsed) throw new Error("unsupported SELECT: " + sql);
    var cols = parsed.cols;
    var table = parsed.table;
    var rest = parsed.rest;
    requireTable(table, sql);
    if(!T[table]) T[table] = [];
    var rows = T[table].map(function(r){ return Object.assign({}, r); });
    /* In strict mode a column the rows do not have is a missing column, which is
       exactly how an un-migrated database reports a new payments field. */
    if(cols !== "*" && strict){
      splitColumns(cols).forEach(function(c2){
        var bare = c2.trim().split(/\s+AS\s+/i)[0].trim();
        if(/\bSELECT\b/i.test(bare)) return;
        if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(bare)) requireColumn(table, bare, sql);
      });
    }
    /* Table aliases: "FROM orders o" and "LEFT JOIN events e ON ...". The token
       right after the table is its alias, unless it is a SQL keyword. */
    var firstTok = ((/^\s+([A-Za-z_][A-Za-z0-9_]*)/.exec(rest) || [])[1] || "").toLowerCase();
    var baseAlias = /^(left|right|inner|outer|cross|full|join|where|order|limit|group|and|or)$/.test(firstTok) ? table : firstTok;
    var aliasMap = {};
    splitColumns(cols).forEach(function(c2){
      var m2 = /^([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z_][A-Za-z0-9_]*)(?:\s+AS\s+([A-Za-z_][A-Za-z0-9_]*))?$/i.exec(c2.trim());
      if(m2) aliasMap[m2[3] || m2[2]] = { table: m2[1].toLowerCase(), column: m2[2] };
    });
    var joinRe = /(?:LEFT\s+)?JOIN\s+([a-z_]+)\s+(?:([a-z_]+)\s+)?ON\s+([A-Za-z_][A-Za-z0-9_.]*)\s*=\s*([A-Za-z_][A-Za-z0-9_.]*)/gi;
    var jm;
    while((jm = joinRe.exec(rest)) !== null){
      var jt = jm[1].toLowerCase();
      /* "a.b_id = b.id" - work out which side belongs to which table so the
         ON clause is not read the wrong way round. */
      var first = jm[3].split("."), second = jm[4].split(".");
      var joinedAlias = (jm[2] || jt).toLowerCase();
      /* A prefix names the joined table whether it is spelled as the table name
         or as its alias ("organizers o"). */
      var isJoined = function(p){ return p === jt || p === joinedAlias; };
      var joinedCol = isJoined(first[0]) ? first[1] : (isJoined(second[0]) ? second[1] : second[0]);
      var baseCol = isJoined(first[0]) ? (second.length > 1 ? second[1] : second[0])
                                      : (first.length > 1 ? first[1] : first[0]);
      rows = rows.map(function(r){
        var match = (T[jt] || []).filter(function(j){ return String(cell(j, joinedCol)) === String(cell(r, baseCol)); })[0] || {};
        var merged = Object.assign({}, r);
        for(var k in match) if(!(k in merged)) merged[k] = match[k];
        merged.__joined = { table: jt, alias: joinedAlias, row: match };
        return merged;
      });
    }
    /* Apply the column aliases: "e.title AS event_title" reads the joined table,
       "o.order_number" the base one. */
    rows = rows.map(function(r){
      var joins = r.__joined ? [r.__joined] : [];
      for(var name in aliasMap){
        var entry = aliasMap[name];
        if(entry.table === baseAlias || entry.table === table){ r[name] = cell(r, entry.column); }
        else {
          for(var j = 0; j < joins.length; j++){
            if(entry.table === joins[j].table || entry.table === joins[j].alias){
              r[name] = joins[j].row ? joins[j].row[entry.column] : null;
            }
          }
        }
      }
      delete r.__joined;
      return r;
    });
    var wm = /\bWHERE\b([\s\S]*?)(?:\bGROUP\s+BY\b|\bORDER\s+BY\b|\bLIMIT\b|$)/i.exec(rest);
    if(wm) rows = rows.filter(function(r){ return matchCond(wm[1], r, cursor(c.a)); });
    /* An aggregate only counts when it is a top-level select item: a COUNT(*)
       inside a subquery must not turn the whole query into an aggregate. */
    var plainCols = splitColumns(cols).filter(function(c2){ return !/\bSELECT\b/i.test(c2); }).join(", ");
    var agg = /COALESCE\(\s*SUM\(([^)]+)\)\s*,\s*0\s*\)|SUM\(([^)]+)\)|COUNT\(\s*\*\s*\)|COALESCE\(\s*(?:MAX|MIN)\(([^)]*)\)\s*,\s*0\s*\)/i.exec(plainCols);
    if(agg){
      var out;
      if(/COUNT/i.test(agg[0])) out = rows.length;
      else if(agg[1] || agg[2]) out = rows.reduce(function(sum, r){ return sum + Number(cell(r, agg[1] || agg[2]) || 0); }, 0);
      else {
        var expr = splitArgs(agg[3])[0];
        var isMax = /MAX/i.test(agg[0]);
        var nums = rows.map(function(r){ return Number(cell(r, expr) || 0); });
        out = isMax ? Math.max.apply(null, [0].concat(nums)) : Math.min.apply(null, [0].concat(nums));
      }
      /* Honour the column alias, e.g. "... AS total". */
      var alias = /\s+AS\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i.exec(cols);
      var named = {};
      named[alias ? alias[1] : "n"] = out;
      return [named];
    }
    var om = /ORDER\s+BY\s+([A-Za-z_][A-Za-z0-9_.]*)\s*(ASC|DESC)?/i.exec(rest);
    if(om){
      var col = om[1].split(".").pop();
      var dir = (om[2] || "ASC").toUpperCase() === "DESC" ? -1 : 1;
      rows.sort(function(a, b){
        var av = cell(a, col), bv = cell(b, col);
        if(av === bv) return 0;
        return (av > bv ? 1 : -1) * dir;
      });
    }
    var lm = /LIMIT\s+(\d+)/i.exec(rest);
    if(lm) rows = rows.slice(0, Number(lm[1]));
    if(cols === "*") return rows;
    var columnList = splitColumns(cols);
    /* The projected name is the alias when there is one, otherwise the column. */
    var want = columnList.map(function(c2){
      var s2 = c2.trim();
      var am = /\s+AS\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i.exec(s2);
      if(am) return am[1];
      return s2.replace(/^\w+\./, "");
    });
    /* A correlated scalar subquery, e.g. "(SELECT MIN(price) FROM ticket_types
       WHERE event_id = e.id) AS starting_price", is evaluated per row. */
    var subqueries = columnList.map(function(c2){
      if(!/\bSELECT\b/i.test(c2)) return null;
      var i2 = c2.indexOf("(");
      if(i2 < 0) return null;
      var depth = 0, close = -1;
      for(var k2 = i2; k2 < c2.length; k2++){
        if(c2[k2] === "(") depth++;
        else if(c2[k2] === ")"){ depth--; if(depth === 0){ close = k2; break; } }
      }
      if(close < 0) return null;
      return { sql: c2.slice(i2, close + 1), alias: /\s+AS\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i.exec(c2) };
    });
    return rows.map(function(r){
      var o = {};
      want.forEach(function(c2, idx){
        if(c2 === "*"){
          /* "e.*" projects every column of the joined row. */
          for(var k in r) o[k] = r[k];
          return;
        }
        if(subqueries[idx]){
          var previousOuter = OUTER;
          OUTER = r;
          var sub;
          try { sub = runSelect(subqueries[idx].sql.replace(/^\s*\(/, ""), []); } finally { OUTER = previousOuter; }
          var value = (sub[0] && (sub[0][subqueries[idx].alias ? subqueries[idx].alias[1] : "n"])) || null;
          o[c2] = value;
        } else {
          o[c2] = (r[c2] === undefined) ? null : r[c2];
        }
      });
      return o;
    });
  }
  function runUpdate(sql, params){
    var c = cursor(params);
    var m = /^UPDATE\s+([a-z_]+)\s+SET\s+([\s\S]+?)\s+WHERE\s+([\s\S]+)$/i.exec(sql.trim());
    if(!m) throw new Error("unsupported UPDATE: " + sql);
    var table = m[1].toLowerCase();
    /* m[3] is the WHERE clause with the keyword already removed. */
    var where = m[3];
    requireTable(table, sql);
    var setParts = splitLogic(m[2], ",");
    if(strict){
      setParts.forEach(function(part){
        var col = /^([A-Za-z_][A-Za-z0-9_]*)\s*=/.exec(part.trim());
        if(col) requireColumn(table, col[1], sql);
      });
    }
    var setParts = splitLogic(m[2], ",");
    var setParams = (m[2].match(/\?/g) || []).length;
    var rows = T[table] || [];
    var changes = 0;
    rows.forEach(function(row){
      /* Parameters bind left to right: the SET values first, then the WHERE. */
      if(!matchCond(where, row, cursor(c.a.slice(setParams)))) return;
      /* One cursor for the whole SET list, so each column takes the next value. */
      var setCursor = cursor(c.a.slice(0, setParams));
      for(var i = 0; i < setParts.length; i++){
        var eq = /^([A-Za-z_][A-Za-z0-9_.]*)\s*=\s*([\s\S]+)$/.exec(setParts[i].trim());
        if(!eq) throw new Error("unsupported SET: " + setParts[i]);
        row[eq[1].split(".").pop()] = valueOf(eq[2], setCursor, row);
      }
      changes++;
    });
    return changes;
  }
  function runInsert(sql, params){
    var c = cursor(params);
    var m = /^INSERT\s+INTO\s+([a-z_]+)\s*\(([^)]+)\)\s*VALUES\s*\(([\s\S]+)\)$/i.exec(sql.trim());
    if(!m) throw new Error("unsupported INSERT: " + sql);
    var table = m[1].toLowerCase();
    requireTable(table, sql);
    if(!T[table]) T[table] = [];
    var cols = m[2].split(",").map(function(c2){ return c2.trim(); });
    var vals = splitArgs(m[3]);
    if(cols.length !== vals.length) throw new Error("column/value mismatch in INSERT INTO " + table);
    var row = {};

    /^\d{6}$/.test(sentCode) && String(happyRow.otp_hash || "") !== sentCode
      && /^[0-9a-f]{64}$/.test(String(happyRow.otp_hash || "")),
    "digits=" + sentCode.length + " stored=" + String(happyRow.otp_hash || "").slice(0, 12) + "...");
  var happyConfirm = await send("/api/tickets/free/verify/confirm",
    { session_token: asked.body.session_token, otp: sentCode }, envF, {}, "10.0.11.2");
  var happyReg = await send("/api/tickets/free/register",
    { continue_token: happyConfirm.body.continue_token, phone: "+254700000001" }, envF, {}, "10.0.11.3");
  ck("code -> verified -> ticket works end to end without trusting the page",
    happyConfirm.status === 200 && happyReg.status === 201 && (happyReg.body.tickets || []).length === 1
      && Number((happyReg.body.order || {}).amount) === 0
      && ((happyReg.body.verification || {}).verified === true),
    happyConfirm.status + "/" + happyReg.status + " " +
      JSON.stringify({ tickets: (happyReg.body.tickets || []).length, code: happyReg.body.code || null }));
  ck("the claimed ticket is emailed to the attendee as usual",
    BREVO_CALLS.length >= 2, "brevo calls=" + BREVO_CALLS.length);
} catch(e){
  ck("the free-ticket group ran to completion", false, (e && (e.stack || e.message)) || String(e));
}



  R.sql_tail = SQL_LOG.slice(-14);
  finish();
})().catch(function(e){
  /* A crash still has to report: the runner is waiting for this POST. */
  ck("harness crashed", false, (e && e.stack) || String(e));
  R.errors = (R.errors || []).concat(errors.slice(0, 12));
  R.mock_errors = (R.mock_errors || []).concat(MOCK_ERRORS.slice(0, 15));
  console.warn = realWarn; console.error = realError;
  finish();
});
