async function call(path, token, env, opts){
  const o = opts || {};

  /* Watchdog: a Worker request that never answers must fail the harness with the
     exact route named, instead of leaving the whole page waiting forever. */
  const answer = (async function(){
    const headers = { "CF-Connecting-IP": o.ip || nextIp() };
    if(token) headers["Authorization"] = "Bearer " + token;
    let body;
    if(o.body !== undefined){ headers["Content-Type"] = "application/json"; body = JSON.stringify(o.body); }
    const res = await W.default.fetch(new Request(API + path, { method: o.method || "GET", headers: headers, body: body }), env, ctx);
    let parsed = null, text = null;
    try { text = await res.clone().text(); } catch(e){ text = null; }
    try { parsed = JSON.parse(text || "null"); } catch(e){ parsed = null; }
    return { status: res.status, body: parsed || {}, text: text || "", headers: res.headers };
  })();
  const watchdog = new Promise(function(resolve){
    setTimeout(function(){ resolve({ status: 0, body: { code: "HARNESS_TIMEOUT", error: label }, text: "", headers: new Headers() }); }, 8000);
  });
  return Promise.race([answer, watchdog]);
}

    const otherDoc = await call("/api/organizer/agreement/document?reference=" + encodeURIComponent(sig.reference), T_ORG2, env);
    ck("a signature reference cannot be fetched by another organizer",
      otherDoc.status === 404, otherDoc.status + " " + otherDoc.body.code);

    /* -------- 6. owner-side records --------------------------------------- */
    const sigs = await call("/api/admin/agreements/1/signatures", T_OWNER, env);
    ck("the signature register lists who accepted, with the reference",
      sigs.status === 200 && sigs.body.total === 1 && String(sigs.body.signatures[0].reference) === sig.reference &&
      String(sigs.body.signatures[0].signatory_email) === "amina@example.com",
      sigs.status + " " + sigs.body.total);
    const auditApi = await call("/api/admin/agreements/audit?limit=200", T_OWNER, env);
    const actions = (auditApi.body.entries || []).map(e => e.action);
    ck("the audit API returns the trail the owner may read",
      auditApi.status === 200 && actions.indexOf("agreement_signed") > -1 && actions.indexOf("publication_blocked") > -1,
      JSON.stringify(actions));
    ck("an organizer cannot read the audit trail", (await call("/api/admin/agreements/audit", T_ORG, env)).status === 403, "");
  } catch(e){ ck("group 4 (publishing, document and records)", false, (e && e.stack) || String(e)); }
try {
    /* -------- 7. a new version replaces the one in force ------------------ */
    const created = await call("/api/admin/agreements", T_OWNER, env, { method: "POST", body: {
      version: "2.0", title: "TicketHub Organizer Agreement",
      content: AGREEMENT_TEXT + "\n4. Version 2 raises the platform fee.",
      summary: "Platform fee increased", effective_date: "2026-06-01",
      fee_config: { commission_percent: 7.5, payout_terms: "Weekly.", refund_policy: "Refunds before the event." }
    } });
    NEW_ID = (created.body.agreement || {}).id;
    ck("the owner creates a new DRAFT version", created.status === 201 && NEW_ID > 0 &&
      String((created.body.agreement || {}).status) === "draft", created.status + " " + (created.body.code || ""));
    const duplicate = await call("/api/admin/agreements", T_OWNER, env,
      { method: "POST", body: { version: "2.0", title: "Copy", content: "x" } });
    ck("a duplicate version number is refused", duplicate.status === 409, duplicate.status + " " + duplicate.body.code);
    const patchDraft = await call("/api/admin/agreements/" + NEW_ID, T_OWNER, env,
      { method: "PATCH", body: { summary: "Platform fee increased to 7.5%" } });
    ck("a draft version can still be edited", patchDraft.status === 200 &&
      String((patchDraft.body.agreement || {}).summary) === "Platform fee increased to 7.5%", patchDraft.status + " " + (patchDraft.body.code || ""));
    const patchActive = await call("/api/admin/agreements/1", T_OWNER, env,
      { method: "PATCH", body: { content: "rewritten after signatures" } });
    ck("an activated version can never be edited afterwards",
      patchActive.status === 409 && patchActive.body.code === "AGREEMENT_IMMUTABLE", patchActive.status + " " + patchActive.body.code);

    const activated = await call("/api/admin/agreements/" + NEW_ID + "/activate", T_OWNER, env, { method: "POST", body: {} });
    ck("activating the draft makes it the version in force and supersedes the old one",
      activated.status === 200 && String((activated.body.superseded || {}).version) === "1.0" &&
      String((db.state.platform_agreements[0] || {}).status) === "superseded",
      activated.status + " " + (activated.body.code || ""));
    ck("activation tells the organizers who have signed before to re-accept",
      Number((activated.body.notifications || {}).updated) === 1 &&
      db.mail("organizer_agreement_updated").length >= 1,
      JSON.stringify(activated.body.notifications || {}));

    const after = await call("/api/organizer/agreement/status", T_ORG, env);
    ck("an organizer signed on the old version is now 'outdated', not signed",
      after.body.state.status === "outdated" && after.body.state.can_publish === false &&
      String(after.body.state.active_version) === "2.0" && String(after.body.state.signed_version) === "1.0",
      JSON.stringify(after.body.state || {}));
    const blockedOld = await call("/api/organizer/events", T_ORG, env,
      { method: "POST", body: newEvent("After Upgrade", { status: "active" }) });
    ck("publishing is blocked again until the new version is accepted",
      blockedOld.status === 403 && blockedOld.body.code === "AGREEMENT_REQUIRED" &&
      String((blockedOld.body.details || {}).agreement_status) === "outdated",
      blockedOld.status + " " + JSON.stringify(blockedOld.body.details || {}));
    const liveStill = db.event(newId) || {};
    ck("the event published under version 1.0 keeps running untouched",
      String(liveStill.status) === "active" && String(liveStill.agreement_version) === "1.0",
      JSON.stringify({ s: liveStill.status, v: liveStill.agreement_version }));

    const inviteV2 = await call("/api/organizer/agreement/invite", T_ORG, env, { method: "POST", body: {} });
    const token2 = tokenOf(inviteV2.body.review_url);
    ck("a new link can be issued for the new version", inviteV2.status === 200 && token2 && token2 !== TOKEN,
      inviteV2.status + " " + (inviteV2.body.code || ""));
    const signedV2 = await call("/api/organizer/agreement/sign", T_ORG, env,
      { method: "POST", body: { token: token2, signatory_name: "Amina Wanjiru", signatory_role: "Director", signature_image: TEST_SIGNATURE_IMAGE, agreed: true } });
    ck("accepting the new version signs it and unlocks publishing",
      signedV2.status === 201 && signedV2.body.state.status === "signed" &&
      String((signedV2.body.signature || {}).agreement_version) === "2.0",
      signedV2.status + " " + JSON.stringify(signedV2.body.state || {}) + " " + (signedV2.body.code || ""));
    ck("the earlier signature is kept: history is never overwritten",
      st.organizer_agreements.length === 2 &&
      String(st.organizer_agreements[0].agreement_version) === "1.0" &&
      String(st.organizer_agreements[1].agreement_version) === "2.0",
      "signatures " + st.organizer_agreements.length);
    const again = await call("/api/organizer/events", T_ORG, env,
      { method: "POST", body: newEvent("After Upgrade", { status: "active" }) });
    ck("publishing works again after re-acceptance", again.status === 201, again.status + " " + (again.body.code || ""));
    const reminders = await call("/api/admin/agreements/" + NEW_ID + "/remind", T_OWNER, env, { method: "POST", body: {} });
    ck("a reminder only reaches organizers who still have not signed",
      reminders.status === 200 && Number((reminders.body.notifications || {}).reminded) === 1,
      JSON.stringify(reminders.body.notifications || {}));
  } catch(e){ ck("group 5 (a new version of the agreement)", false, (e && e.stack) || String(e)); }
try {
    /* -------- 8. fail closed when no version is in force ------------------- */
    const bare = makeEnv({}, { no_agreement: true });
    const bareApprove = await call("/api/owner/events/10", T_OWNER, bare, { method: "PUT", body: { status: "active" } });
    ck("with no active agreement at all, approval is refused rather than allowed",
      bareApprove.status === 403 && bareApprove.body.code === "AGREEMENT_REQUIRED" &&
      String((bareApprove.body.details || {}).agreement_status) === "not_configured",
      bareApprove.status + " " + JSON.stringify(bareApprove.body.details || {}));
    const bareCreate = await call("/api/organizer/events", T_ORG, bare,
      { method: "POST", body: newEvent("No Terms Yet", { status: "active" }) });
    ck("an organizer publishing into an unconfigured agreement is refused too",
      bareCreate.status === 403 && bareCreate.body.code === "AGREEMENT_REQUIRED",
      bareCreate.status + " " + bareCreate.body.code);
    const bareDraft = await call("/api/organizer/events", T_ORG, bare, { method: "POST", body: newEvent("Still A Draft") });
    ck("drafts keep working even when the agreement is unconfigured",
      bareDraft.status === 201, bareDraft.status + " " + (bareDraft.body.code || ""));
    const bareInvite = await call("/api/organizer/agreement/invite", T_ORG, bare, { method: "POST", body: {} });
    ck("there is nothing to sign yet, and the page says so",
      bareInvite.status === 409 && bareInvite.body.code === "AGREEMENT_NOT_CONFIGURED",
      bareInvite.status + " " + bareInvite.body.code);
  } catch(e){ ck("group 6 (fail closed)", false, (e && e.stack) || String(e)); }
try {
    /* -------- 9. formatted text survives, unsafe markup does not ----------- */
    const RICH = '<h3>1. Definitions</h3>' +
      '<p>The organizer may publish events and <strong>sell tickets</strong> on TicketHub, ' +
      'subject to <em>these terms</em>, which are <u>binding</u>.</p>' +
      '<ul><li>Platform fee: <strong>5%</strong> of the ticket subtotal.</li><li>Payouts weekly.</li></ul>' +
      '<blockquote><p>Refunds are handled per the refund policy.</p></blockquote>' +
      '<p><a href="https://tickethub.co/terms/">Read the public terms</a>.</p>' +
      '<p onclick="steal()">Owner text</p><script>alert(1)<\\/script>' +
      '<p><a href="javascript:alert(1)">bad link</a></p><iframe src="https://evil.test"></iframe>' +
      '<p style="position:fixed">styled</p><img src=x onerror=alert(1)>';
    const richVersion = await call("/api/admin/agreements", T_OWNER, env, { method: "POST", body: {
      version: "3.0", title: "Formatted agreement",
      content: RICH, summary: "Formatting round trip",
      fee_config: { commission_percent: 5 }
    } });
    ck("a formatted agreement is accepted", richVersion.status === 201,
      richVersion.status + " " + (richVersion.body.code || ""));
    const storedRich = (richVersion.body.agreement || {}).content || "";
    ck("bold, italic, underline, headings and lists are stored as written",
      /<h3>1\. Definitions<\/h3>/.test(storedRich) && /<strong>sell tickets<\/strong>/.test(storedRich) &&
      /<em>these terms<\/em>/.test(storedRich) && /<u>binding<\/u>/.test(storedRich) &&
      /<li>/.test(storedRich) && /<blockquote>/.test(storedRich),
      storedRich.slice(0, 120));
    ck("a real https link is kept, with a safe rel",
      /<a href="https:\/\/tickethub\.co\/terms\/" rel="noopener noreferrer">/.test(storedRich),
      (storedRich.match(/<a[^>]*>/g) || []).join(" "));
    ck("scripts, handlers, javascript: links and styles are stripped",
      !/script|onclick|onerror|javascript:|style=|<iframe|<img/i.test(storedRich),
      storedRich.replace(/</g, "&lt;").slice(0, 200));
    ck("the words of a stripped element survive (no clause is silently deleted)",
      /Owner text/.test(storedRich) && /styled/.test(storedRich) && /bad link/.test(storedRich), "");
    ck("the stored version reports itself as formatted html",
      String((richVersion.body.agreement || {}).content_format) === "html",
      String((richVersion.body.agreement || {}).content_format));

    const richId = (richVersion.body.agreement || {}).id;
    const actRich = await call("/api/admin/agreements/" + richId + "/activate", T_OWNER, env, { method: "POST", body: {} });
    ck("the formatted version can be activated", actRich.status === 200, actRich.status + " " + (actRich.body.code || ""));
    const readRich = await call("/api/organizer/agreement", T_ORG, env);
    ck("the organizer reads the SAME formatting, in the same order",
      /<h3>1\. Definitions<\/h3>/.test(readRich.body.content || "") &&
      /<strong>sell tickets<\/strong>/.test(readRich.body.content || "") &&
      readRich.body.content_format === "html" &&
      String(readRich.body.content).indexOf("<h3>") < String(readRich.body.content).indexOf("<ul>"),
      String(readRich.body.content || "").slice(0, 120));
    ck("the organizer's copy carries no script, handler or style either",
      !/script|onclick|javascript:|style=|<iframe/i.test(readRich.body.content || ""), "");
    const richPlain = await call("/api/organizer/agreement/verify?token=" + encodeURIComponent(TOKEN), T_ORG, env);
    ck("a plain-text link still answers with paragraphs, not raw markup",
      /<p>/.test(richPlain.body.content || "") && richPlain.body.content_format === "text",
      String(richPlain.body.content_format));
  } catch(e){ ck("group 7 (formatted agreement text)", false, (e && e.stack) || String(e)); }

  try {
    /* -------- 10. a mangled signing link is refused, plainly -------------- */
    const mangled = await call("/api/organizer/agreement/verify?token=X2wYU76PpNg6L8CLArn7Ox3akrEB0undefinedundefinedePeX4Wewi", T_ORG, env);
    ck("a token with junk pasted into it is refused as invalid (not as expired)",
      mangled.status === 404 && mangled.body.code === "AGREEMENT_LINK_INVALID",
      mangled.status + " " + mangled.body.code);
    const signMangled = await call("/api/organizer/agreement/sign", T_ORG, env,
      { method: "POST", body: { token: TOKEN + "undefined", signatory_name: "Amina Wanjiru", agreed: true } });
    ck("the same mangled token cannot be used to sign", signMangled.status === 404,
      signMangled.status + " " + signMangled.body.code);
    const issued = await call("/api/organizer/agreement/invite", T_ORG2, env, { method: "POST", body: {} });
    const freshToken = tokenOf(issued.body.review_url);
    ck("an issued signing token is 43 URL-safe characters",
      /^[A-Za-z0-9_-]{43}$/.test(freshToken), freshToken);
  } catch(e){ ck("group 8 (mangled signing links)", false, (e && e.stack) || String(e)); }

  /* The gate must be one shared function, not three copies: a future route that
     forgets it is the failure mode this feature exists to prevent. */
  const workerSrc = await (await realFetch("./worker/index.js")).text();
  ck("the publication gate is one function called from every publication path",
    (workerSrc.match(/requireAgreementForPublish\(env, request/g) || []).length === 4,
    "call sites " + (workerSrc.match(/requireAgreementForPublish\(env, request/g) || []).length);
  ck("the gate only passes when a signature exists, and otherwise throws",
    /if\(!state\.required\) return state;/.test(workerSrc) && /throw failure;/.test(workerSrc) &&
    /can_publish: false/.test(workerSrc), "");
  ck("every event publication path is covered (create, edit, owner approval)",
    /source: "event_create"/.test(workerSrc) && /source: "event_update"/.test(workerSrc) &&
    /source: "owner_approval"/.test(workerSrc), "");

  finish();
})();
</script>
